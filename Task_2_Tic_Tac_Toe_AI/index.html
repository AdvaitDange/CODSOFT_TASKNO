<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Tic-Tac-Toe AI (Minimax) - Advait Dange</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1c29;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-coral: #ff7b72;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-app {
            width: 100%;
            max-width: 520px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .header a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #12141f;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .controls-row label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .controls-row select {
            background-color: #1a1c29;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.85rem;
            outline: none;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: #161824;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .score-box h4 {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .score-box span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .status-badge {
            background-color: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 22px;
            text-align: center;
            width: 100%;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 12px;
            margin-bottom: 24px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #232738;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 2.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .cell:hover:not(.taken) {
            background-color: #2f344d;
            border-color: var(--accent-blue);
        }

        .cell.x {
            color: var(--accent-coral);
        }

        .cell.o {
            color: var(--accent-blue);
        }

        .btn-restart {
            background-color: var(--accent-blue);
            color: #0f111a;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn-restart:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="game-app">
        <div class="header">
            <h1>🎮 Tic-Tac-Toe AI</h1>
            <p>CodSoft AI Internship - Task 2 | Minimax Search Algorithm</p>
            <p style="margin-top: 4px;">Developer: <strong>Advait Dange</strong> &nbsp;|&nbsp; <a href="https://github.com/AdvaitDange/CODSOFT_TASKNO" target="_blank">GitHub Repo ↗</a></p>
        </div>

        <div class="controls-row">
            <label for="diffSelect">Difficulty Mode:</label>
            <select id="diffSelect" onchange="resetGame()">
                <option value="unbeatable" selected>Unbeatable (Minimax AI)</option>
                <option value="medium">Medium (Hybrid)</option>
                <option value="easy">Easy (Random)</option>
            </select>
        </div>

        <div class="scoreboard">
            <div class="score-box">
                <h4>You (X)</h4>
                <span id="scoreUser" style="color: var(--accent-coral);">0</span>
            </div>
            <div class="score-box">
                <h4>Ties</h4>
                <span id="scoreTies" style="color: #fab387;">0</span>
            </div>
            <div class="score-box">
                <h4>AI (O)</h4>
                <span id="scoreAI" style="color: var(--accent-blue);">0</span>
            </div>
        </div>

        <div class="status-badge" id="statusBadge">Your turn! Click any cell to place 'X'</div>

        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <button class="btn-restart" onclick="resetGame()">🔄 Restart Board</button>
    </div>

    <script>
        let boardState = Array(9).fill(" ");
        let gameOver = false;
        let scores = { user: 0, ties: 0, ai: 0 };

        function render() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] === " " ? "" : (boardState[i] === "X" ? "✕" : "◯");
                cell.className = "cell" + (boardState[i] === "X" ? " x taken" : (boardState[i] === "O" ? " o taken" : ""));
            });
        }

        function makeMove(idx) {
            if (boardState[idx] !== " " || gameOver) return;

            // Player Move
            boardState[idx] = "X";
            render();

            if (checkWin(boardState, "X")) {
                document.getElementById('statusBadge').innerText = "🎉 Incredible! You won against the AI!";
                scores.user++;
                updateScores();
                gameOver = true;
                return;
            }

            if (isFull(boardState)) {
                document.getElementById('statusBadge').innerText = "🤝 It's a DRAW! Well played!";
                scores.ties++;
                updateScores();
                gameOver = true;
                return;
            }

            // AI Move
            document.getElementById('statusBadge').innerText = "AI is calculating optimal Minimax move...";
            setTimeout(() => {
                const aiIdx = calculateAIMove();
                if (aiIdx !== null) {
                    boardState[aiIdx] = "O";
                    render();

                    if (checkWin(boardState, "O")) {
                        document.getElementById('statusBadge').innerText = "🤖 AI Wins! Minimax Algorithm remains undefeated!";
                        scores.ai++;
                        updateScores();
                        gameOver = true;
                        return;
                    }

                    if (isFull(boardState)) {
                        document.getElementById('statusBadge').innerText = "🤝 It's a DRAW! Well played!";
                        scores.ties++;
                        updateScores();
                        gameOver = true;
                        return;
                    }
                }
                document.getElementById('statusBadge').innerText = "Your turn! Click an empty cell.";
            }, 250);
        }

        function checkWin(b, p) {
            const wins = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];
            return wins.some(line => line.every(pos => b[pos] === p));
        }

        function isFull(b) {
            return b.every(spot => spot !== " ");
        }

        function calculateAIMove() {
            const avail = boardState.map((s, i) => s === " " ? i : null).filter(i => i !== null);
            if (avail.length === 0) return null;

            const diff = document.getElementById('diffSelect').value;
            if (diff === 'easy') {
                return avail[Math.floor(Math.random() * avail.length)];
            }
            if (diff === 'medium' && Math.random() < 0.4) {
                return avail[Math.floor(Math.random() * avail.length)];
            }

            // Unbeatable: Minimax
            if (avail.length === 9) return 4; // center

            let bestScore = -Infinity;
            let bestMove = avail[0];

            for (let m of avail) {
                boardState[m] = "O";
                let score = minimax(boardState, 0, false, -Infinity, Infinity);
                boardState[m] = " ";
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = m;
                }
            }
            return bestMove;
        }

        function minimax(b, depth, isMax, alpha, beta) {
            if (checkWin(b, "O")) return 10 - depth;
            if (checkWin(b, "X")) return depth - 10;
            if (isFull(b)) return 0;

            const avail = b.map((s, i) => s === " " ? i : null).filter(i => i !== null);

            if (isMax) {
                let maxEval = -Infinity;
                for (let m of avail) {
                    b[m] = "O";
                    let ev = minimax(b, depth + 1, false, alpha, beta);
                    b[m] = " ";
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let m of avail) {
                    b[m] = "X";
                    let ev = minimax(b, depth + 1, true, alpha, beta);
                    b[m] = " ";
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function updateScores() {
            document.getElementById('scoreUser').innerText = scores.user;
            document.getElementById('scoreTies').innerText = scores.ties;
            document.getElementById('scoreAI').innerText = scores.ai;
        }

        function resetGame() {
            boardState = Array(9).fill(" ");
            gameOver = false;
            document.getElementById('statusBadge').innerText = "Your turn! Click any cell to place 'X'";
            render();
        }

        render();
    </script>
</body>
</html>
